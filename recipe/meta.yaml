{% set name = "jsonpatch" %}
{% set version = "1.35" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 679ad08672b4663c7ef1e5f3331d940f5e7786661b9acc1530104be1638e7a4f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python
    - jsonpointer >=3.2

test:
  imports:
    - jsonpatch
  requires:
    - pip
    - pytest
  source_files:
    - tests.*
  commands:
    - pip check
    - pytest tests.py

about:
  home: https://github.com/stefankoegl/python-json-patch
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Apply JSON-Patches (RFC 6902)
  description: |
    python-json-patch is a Python library for applying JSON patches (RFC 6902).
    Python 2.7 and 3.4+ are supported. Tests are run on both CPython and PyPy.
  dev_url: https://github.com/stefankoegl/python-json-patch
  doc_url: https://python-json-patch.readthedocs.io

extra:
  recipe-maintainers:
    - pavelzw
    - anguslees
    - pmlandwehr
