{% set name = "jsonpatch" %}
{% set version = "1.38" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: debc3e7bdc3d446468d64987f51a0e7a9deea42987ff90a6d1005a489b471c19

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python
    - jsonpointer >=3.2

test:
  imports:
    - jsonpatch
  requires:
    - pip
    - pytest
  source_files:
    - tests.*
  commands:
    - pip check
    - pytest -vv tests.py

about:
  home: https://github.com/stefankoegl/python-json-patch
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Apply JSON-Patches (RFC 6902)
  description: |
    python-json-patch is a Python library for applying JSON patches (RFC 6902).
    Python 2.7 and 3.4+ are supported. Tests are run on both CPython and PyPy.
  dev_url: https://github.com/stefankoegl/python-json-patch
  doc_url: https://python-json-patch.readthedocs.io

extra:
  recipe-maintainers:
    - pavelzw
    - anguslees
    - pmlandwehr
