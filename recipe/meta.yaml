{% set name = "jsonpatch" %}
{% set version = "1.44" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 88fc1d9728168b4a9be27bb00de469dfb3cd28e8e5b568b24efb2ac583cba7b9

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
  run:
    - python
    - jsonpointer >=3.8

test:
  imports:
    - jsonpatch
  requires:
    - pip
    - pytest
  source_files:
    - tests.*
  commands:
    - pip check
    - pytest -vv tests.py

about:
  home: https://github.com/stefankoegl/python-json-patch
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Apply JSON-Patches (RFC 6902)
  description: |
    python-json-patch is a Python library for applying JSON patches (RFC 6902).
    Python 2.7 and 3.4+ are supported. Tests are run on both CPython and PyPy.
  dev_url: https://github.com/stefankoegl/python-json-patch
  doc_url: https://python-json-patch.readthedocs.io

extra:
  recipe-maintainers:
    - pavelzw
    - anguslees
    - pmlandwehr
